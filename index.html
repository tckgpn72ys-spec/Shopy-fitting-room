<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOPY V0.3 - Street Luxe AR</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#070707] text-white min-h-screen">
<header class="p-6 flex justify-between max-w-7xl mx-auto">
<h1 class="font-black tracking-[0.4em] text-xl" style="font-family:Syne">SHOPY</h1>
<div class="flex gap-2"><span class="text-[9px] border border-white/10 px-3 py-1 rounded-full">V0.3 STREET LUXE</span><span class="text-[9px] bg-white text-black px-3 py-1 rounded-full">AR ACTIVE</span></div>
</header>

<div class="max-w-7xl mx-auto grid md:grid-cols-[1.2fr_0.8fr] gap-6 p-6">
<!-- FITTING ROOM -->
<div class="relative bg-[#111] rounded-[32px] h-[700px] overflow-hidden border border-white/5 flex items-center justify-center">
<video id="camera" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover opacity-40 hidden"></video>
<div id="mannequin" class="relative z-10 scale-110">
<div class="text-[180px]">🧍🏾</div>
<div id="top" class="absolute top-[22%] left-1/2 -translate-x-1/2 text-6xl transition-all">🧥</div>
<div id="bottom" class="absolute top-[53%] left-1/2 -translate-x-1/2 text-6xl transition-all">👖</div>
<div id="shoe" class="absolute top-[80%] left-1/2 -translate-x-1/2 text-5xl">👟</div>
<div id="cap" class="absolute top-[5%] left-1/2 -translate-x-1/2 text-4xl"></div>
</div>
<button onclick="toggleCam()" class="absolute top-6 right-6 z-20 bg-white text-black px-4 py-2 rounded-full text-xs font-bold">📷 CAMERA ON</button>
<div class="absolute bottom-6 left-6 z-20 flex gap-2">
<button onclick="size('S')" class="size-btn bg-white/10 px-3 py-1 rounded-full text-xs">S</button>
<button onclick="size('M')" class="size-btn bg-white text-black px-3 py-1 rounded-full text-xs">M</button>
<button onclick="size('L')" class="size-btn bg-white/10 px-3 py-1 rounded-full text-xs">L</button>
</div>
</div>

<!-- SHOP -->
<div class="space-y-6">
<h2 class="text-4xl font-bold" style="font-family:Syne">STREET<br><span class="text-white/30">LUXE DROP</span></h2>

<div>
<p class="text-[10px] tracking-widest text-white/30 mb-2">HOODIE / JACKET</p>
<div class="flex flex-wrap gap-2">
<button onclick="setItem('top','🧥')" class="bg-white text-black px-4 py-2 rounded-full text-sm">Puff Black</button>
<button onclick="setItem('top','🦺')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Cargo Vest</button>
<button onclick="setItem('top','👕')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Oversize Tee</button>
</div>
</div>

<div>
<p class="text-[10px] tracking-widest text-white/30 mb-2">CARGO / DENIM</p>
<div class="flex flex-wrap gap-2">
<button onclick="setItem('bottom','👖')" class="bg-white text-black px-4 py-2 rounded-full text-sm">Baggy Jean</button>
<button onclick="setItem('bottom','🩳')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Cargo Short</button>
<button onclick="setItem('bottom','👗')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Tech Cargo</button>
</div>
</div>

<div>
<p class="text-[10px] tracking-widest text-white/30 mb-2">SNEAKERS / CAP</p>
<div class="flex flex-wrap gap-2">
<button onclick="setItem('shoe','👟')" class="bg-white text-black px-4 py-2 rounded-full text-sm">Jordan 4</button>
<button onclick="setItem('cap','🧢')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Cap LA</button>
<button onclick="setItem('cap','🎩')" class="bg-[#1A1A1A] border border-white/10 px-4 py-2 rounded-full text-sm">Beanie</button>
</div>
</div>

<div class="pt-4 border-t border-white/10">
<div class="flex gap-2 mb-4">
<div onclick="color('#fff')" class="w-8 h-8 bg-white rounded-full border-2 border-white"></div>
<div onclick="color('#ff0000')" class="w-8 h-8 bg-red-600 rounded-full"></div>
<div onclick="color('#00ff88')" class="w-8 h-8 bg-green-400 rounded-full"></div>
<div onclick="color('#000')" class="w-8 h-8 bg-black border border-white/20 rounded-full"></div>
</div>
<button class="w-full bg-white text-black py-4 rounded-full font-black text-sm tracking-widest">ADD TO CART - $129</button>
<p class="text-[9px] text-white/20 text-center mt-3 tracking-widest">SHOPY x MINDVERSE INFINITY • KINSHASA DRIP • BETA</p>
</div>
</div>
</div>

<script>
let camOn=false
function setItem(id,emoji){document.getElementById(id).innerText=emoji}
function size(s){
let scale=s=='S'?0.9:s=='L'?1.3:1.1
document.getElementById('mannequin').style.transform=`scale(${scale})`
document.querySelectorAll('.size-btn').forEach(b=>b.className='size-btn bg-white/10 px-3 py-1 rounded-full text-xs')
event.target.className='size-btn bg-white text-black px-3 py-1 rounded-full text-xs'
}
function color(c){document.getElementById('top').style.filter=c=='#fff'?'':'drop-shadow(0 0 20px '+c+') hue-rotate(90deg)'}
async function toggleCam(){
const v=document.getElementById('camera')
if(!camOn){try{const s=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=s;v.classList.remove('hidden');camOn=true;event.target.innerText='📷 CAM OFF'}catch(e){alert('Autorise la caméra')}}
else{v.srcObject.getTracks().forEach(t=>t.stop());v.classList.add('hidden');camOn=false;event.target.innerText='📷 CAMERA ON'}
}
</script>
</body>
</html>
